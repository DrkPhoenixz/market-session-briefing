name: Send Pirates Harbor Daily to Discord

on:
  push:
    branches: [main]
    paths:
      - "briefings/latest.md"
      - "briefings/dashboard.json"
      - "generate_dashboard.py"
      - "send_discord.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pirates-harbor-discord
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate dashboard PNG
        run: python generate_dashboard.py
      - name: Send dashboard and summary
        run: python send_discord.py
