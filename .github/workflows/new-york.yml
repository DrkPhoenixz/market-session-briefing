name: Send Hourly Market News to Discord

on:
  push:
    branches: [main]
    paths:
      - "briefings/hourly.json"
      - "send_discord.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pirates-harbor-hourly-discord
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send hourly market news
        run: python send_discord.py
